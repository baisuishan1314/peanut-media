name: Sync RCU Data

on:
  schedule:
    # 每30分钟运行一次 (UTC时间)
    - cron: '*/30 * * * *'
  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync RCU data
        id: sync
        run: python sync_rcu.py

      - name: Commit and push
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: sync RCU data $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
            git push
            echo "Pushed updates"
          fi
